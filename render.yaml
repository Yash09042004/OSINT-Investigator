# =============================================================================
# PRISM - Render.com Deployment Configuration
# =============================================================================
# This file configures automatic deployment on Render.com
#
# To deploy:
# 1. Push this repository to GitHub
# 2. Connect your GitHub repo to Render.com
# 3. Render will automatically detect this render.yaml file
# 4. Your app will be deployed at https://your-app-name.onrender.com
# =============================================================================

services:
  - type: web
    name: prism
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free  # Change to 'starter' or 'standard' for production
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: prism-data
      mountPath: /var/lib/prism
      sizeGB: 1  # Adjust as needed
